name: Build & Deploy

# Build the Astro site on every push and pull request (the pull-request run is the
# pre-merge test gate: it fails if the build breaks or an internal link is dead).
# Deploy to GitHub Pages only when changes land on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer one supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check internal links
        run: node scripts/check-links.mjs
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploy only for pushes to main. Pull-request runs stop after `build`, so a
  # broken build or dead link blocks the merge without ever touching production.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
